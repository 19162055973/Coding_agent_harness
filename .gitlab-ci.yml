stages:
  - test
  - build

unit-test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -e ".[dev]"
    - python -m pytest -q
    - python -m forgeloop.demo.mechanisms
  artifacts:
    when: always
    paths:
      - .pytest_cache/
    expire_in: 1 week

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t forgeloop:ci .
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  allow_failure: true
