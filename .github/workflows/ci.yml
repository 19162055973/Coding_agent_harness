name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Mechanism demos
        run: python -m forgeloop.demo.mechanisms
